name: Build Windows executable

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup vcpkg and install SFML
      shell: powershell
      run: |
        git clone https://github.com/microsoft/vcpkg.git vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg.exe install sfml[audio,window,graphics]:x64-windows

    - name: Configure (CMake)
      shell: powershell
      run: |
        $Toolchain = "${{ github.workspace }}\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake"
        cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$Toolchain" -DBUILD_GUI=ON -DEMBED_FONT=ON

    - name: Build (Release)
      shell: powershell
      run: |
        cmake --build build --config Release --target reversi -j

    - name: Collect runtime files and package (with diagnostics)
      shell: powershell
      run: |
        Write-Host "=== Packaging diagnostics: listing build tree ==="
        if (Test-Path build) { Get-ChildItem -Path build -Recurse | ForEach-Object { Write-Host $_.FullName } } else { Write-Host "[DIAG] No build directory found" }

        $exePath = "build\Release\reversi.exe"
        Write-Host "[DIAG] Checking for executable: $exePath"
        if (-not (Test-Path $exePath)) {
          Write-Host "[ERROR] Executable not found at $exePath"
          Write-Host "[DIAG] Showing build\Release contents (if any):"
          if (Test-Path build\Release) { Get-ChildItem -Path build\Release | ForEach-Object { Write-Host $_.FullName } } else { Write-Host "[DIAG] build\\Release does not exist" }
          exit 1
        }

        Write-Host "[DIAG] Creating package directory and copying files"
        mkdir package
        Copy-Item -Path $exePath -Destination package\ -Force

        if (Test-Path fonts) { Write-Host "[DIAG] Copying fonts/"; Copy-Item -Path fonts -Destination package\ -Recurse -Force } else { Write-Host "[DIAG] fonts/ not present" }
        if (Test-Path sounds) { Write-Host "[DIAG] Copying sounds/"; Copy-Item -Path sounds -Destination package\ -Recurse -Force } else { Write-Host "[DIAG] sounds/ not present" }

        # copy SFML DLLs from vcpkg installed folder
        $vcpkgBin = Join-Path -Path "${{ github.workspace }}" -ChildPath "vcpkg\\installed\\x64-windows\\bin"
        Write-Host "[DIAG] vcpkg bin path: $vcpkgBin"
        if (Test-Path $vcpkgBin) {
          Write-Host "[DIAG] Listing DLLs in vcpkg bin"
          Get-ChildItem -Path $vcpkgBin -Filter *.dll | ForEach-Object { Write-Host "DLL: $($_.FullName)" }
          Copy-Item -Path (Join-Path $vcpkgBin "*.dll") -Destination package\ -Force
        } else {
          Write-Host "[DIAG] vcpkg bin not found at $vcpkgBin"
        }

        # create zip
        Write-Host "[DIAG] Creating ZIP archive reversi-windows.zip"
        Compress-Archive -Path package\* -DestinationPath reversi-windows.zip -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: reversi-windows
        path: reversi-windows.zip
